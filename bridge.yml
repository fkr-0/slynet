version: 1

commands:
  test:
    description: Run the Janet test suite
    category: test
    run:
      - sh
      - -lc
      - export JANET_PATH="${JANET_PATH}:$(pwd)" && janet test/run_tests.janet

  test-runner:
    description: Run the Janet test runner entrypoint
    category: test
    run:
      - sh
      - -lc
      - export JANET_PATH="${JANET_PATH}:$(pwd)" && janet test-runner.janet

  test-emacs:
    description: Run the Eldev-backed Emacs client ERT suite
    category: test
    run:
      - sh
      - -lc
      - eldev test --expect 35

  smoke-client:
    description: Run the CLI client in batch mode against a local server
    category: test
    run:
      - sh
      - -lc
      - export JANET_PATH="${JANET_PATH}:$(pwd)" && janet slynet-client.janet --help
