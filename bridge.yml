version: 1
name: slynet
description: Janet development environment for Emacs

commands:
  lint:
    description: Parse Janet sources and run Emacs package lint
    category: lint
    run: [make, lint]

  compile:
    description: Byte-compile the Emacs package through Eldev
    category: build
    run: [make, compile]

  test:
    description: Run the Janet test suite
    category: test
    run: [make, test]

  test-emacs:
    description: Run the Eldev-backed Emacs ERT suite
    category: test
    run: [make, test-emacs]

  test-fuzz:
    description: Run 10,000 deterministic fragmented-frame fuzz cases
    category: test
    run: [make, test-fuzz]

  test-e2e:
    description: Repeat live Janet/Emacs lifecycle tests and check for leaks
    category: test
    run: [make, test-e2e]

  package:
    description: Build Janet and Emacs release artifacts
    category: build
    run: [make, package]

  clean:
    description: Remove generated release and build artifacts
    category: custom
    run: [make, clean]

  release-verify:
    description: Run the complete local release gate without tagging
    category: test
    timeoutMs: 180000
    run: [make, release-verify]
