  - id: completion_arglists_autodoc
    reference_files:
    - sly_source/slynk/slynk-completion.lisp
    - sly_source/contrib/slynk-arglists.lisp
    - sly_source/contrib/sly-autodoc.el
    janet_files:
    - slynet/completion.janet
    - slynet/contrib/slynet-arglists.janet
    current_state: partial
    evidence:
    - simple-completions and flex-completions are marked implemented.
    gaps:
    - operator-arglist, describe-function, autodoc, and Janet macro/function signature
      extraction need golden tests.
    janet_constraints:
    - Janet supports fixed, variadic, and macro forms but not CL lambda-list keywords
      such as &optional and &key with identical semantics. Translation must normalize
      signatures into an Emacs display model.
  - id: contrib_parity
    reference_files:
    - sly_source/contrib/*.el
    - sly_source/contrib/slynk-*.lisp
    janet_files:
