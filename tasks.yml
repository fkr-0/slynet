translation_state_comparison:
  summary: The project already contains a sizable Janet backend and green tests, but
    its protocol inventory documents are inconsistent. TASKS.md marks handshake, channel,
    contrib, filesystem, REPL, and test harness work as complete or mostly complete,
    while docs/missing_protocol.md still lists some of those same RPCs as missing.
    tasks.yml therefore treats inventory reconciliation as the first product task.
  areas:
  - id: protocol_handshake
    reference_files:
    - sly_source/slynk/slynk.lisp
    janet_files:
    - slynet/slynk.janet
    - slynet/completion.janet
    current_state: tested_partial
    evidence:
    - Baseline suite includes passing tests for simple completions and connection-info.
    - TASKS.md marks ping, connection-info, list-all-package-names, simple-completions,
      and flex-completions complete.
    gaps:
    - docs/missing_protocol.md still lists these operations as missing; stale inventory.
    next_test_focus:
    - Machine-generated protocol inventory must classify implemented/tested/stub/missing.
  - id: interface_registry
    reference_files:
    - sly_source/slynk/slynk-backend.lisp
    - impl_spec.yml
    janet_files:
    - slynet/interfaces.janet
    - slynet/infrastructure.janet
    - slynet/rpc.janet
    current_state: tested_partial
    evidence:
    - Baseline suite passes definterface and defimplementation registry tests.
    gaps:
    - 'Spec source is too small: impl_spec.yml contains only six operations.'
    - 'missing_protocol_definterface.md contains CL lambda-list syntax and at least
      one typo: d(definterface operator-arglist...).'
    next_test_focus:
    - Spec parser must reject invalid sketches and generate normalized operation records.
  - id: eval_repl_editing
    reference_files:
    - sly_source/slynk/slynk.lisp
    - sly_source/contrib/slynk-mrepl.lisp
    janet_files:
    - slynet/slynk.janet
    - slynet/contrib/slynet-mrepl.janet
    current_state: partial
    evidence:
    - TASKS.md marks interactive-eval, eval-for-emacs, set-package, guess-and-set-package
      complete.
    gaps:
    - value editing, pretty-printing, package semantics, and MREPL lifecycle need
      contract tests against the SLY wire protocol shape.
    janet_constraints:
    - Janet has environments/modules, not CL packages. set-package can preserve Emacs-facing
      session metadata but cannot make Janet reader/evaluator obey CL package lookup
      semantics.
  - id: compiler_macroexpand_loader
    reference_files:
    - sly_source/slynk/slynk.lisp
    janet_files:
    - slynet/slynk.janet
    current_state: partial_or_stub
    gaps:
    - compile-file-for-emacs, compile-string-for-emacs variants, load-file, slynk-require,
      macroexpand families need exact result-shape tests.
    janet_constraints:
    - Janet compile/load diagnostics differ from CL compiler notes; translation must
      expose best-effort diagnostics with explicit non-equivalence tags.
  - id: debugger_restarts_conditions
    reference_files:
    - sly_source/slynk/slynk.lisp
    - sly_source/slynk/backend/*.lisp
    janet_files:
    - slynet/slynk.janet
    current_state: mostly_missing_or_emulated
    gaps:
    - backtrace, debugger-info-for-emacs, invoke-nth-restart, sly-db-* stepping and
      restarts require a Janet-specific debugger model.
    janet_constraints:
    - Janet exceptions do not provide CL condition/restart semantics. abort/continue/restart
      APIs must be marked emulated, limited, or unsupported depending on the runtime
      evidence.
  - id: inspector_gray_printer
    reference_files:
    - sly_source/slynk/slynk.lisp
    - sly_source/contrib/slynk-fancy-inspector.lisp
    - sly_source/slynk/slynk-gray.lisp
