version: 1
project: slynet
generated_at: '2026-05-13'
status: draft_source_of_truth
purpose: 'Maintain an executable, test-first plan for a feature-complete-as-possible
  Janet implementation of the SLY/SLYNK experience: the Janet-side SLYNK-equivalent
  runtime/backend called slynt, plus an operational Emacs Lisp frontend called slynet.'
operating_rules:
  tdd_required: true
  no_production_change_without_red_test: true
  verification_before_completion: true
  update_this_file_when:
  - a protocol operation changes status
  - a Janet design constraint is discovered
  - a test proves or disproves an assumption
  - a task is completed, split, merged, or invalidated
  completion_gate: A task may move to done only after its red test has been observed
    failing for the intended reason, the minimal implementation passes it, and the
    relevant focused and aggregate verification commands are recorded here.
verified_baseline:
  date: '2026-05-13'
  command: bridge.yml:test => sh -lc 'export JANET_PATH=${JANET_PATH}:$(pwd) && janet
    test/run_tests.janet'
  result:
    exit_code: 0
    duration_ms: 718
    summary: 43 tests, 133/133 assertions passed, 0 failed
  observations:
  - Existing Janet test suite is green at the baseline used for this plan.
  - 'stdout is very noisy: prin1-to-string-for-emacs and SLYNET RECV traces appear
    during normal tests.'
  - stderr contains expected negative-test diagnostics from mini-test.janet:82 even
    when exit code is 0.
  - The repository working tree was already dirty before creating this file; this
    plan must not claim ownership of pre-existing modified files.
  immediate_consequence: Treat the current implementation as a usable but noisy baseline.
    Before declaring release readiness, tests must be made quiet or explicitly assert
    expected stderr.
