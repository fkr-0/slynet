    - sly_source/contrib/sly-mrepl.el
    - sly_source/lib/*.el
    janet_files: []
    proposed_files:
    - emacs/slynet.el
    - emacs/slynet-client.el
    - emacs/slynet-mrepl.el
    - emacs/slynet-tests.el
    current_state: missing
    gaps:
    - No operational Emacs Lisp frontend is present in the project tree.
    target: Provide a thin SLY-like Emacs frontend for Janet that reuses compatible
      SLY UI concepts but speaks the SLYNET/Janet protocol and exposes interaction,
      eval, completion, MREPL, inspector, debugger-status, and connection management.
janet_design_constraints:
- id: cl_packages
  cl_feature: Packages, symbols, nicknames, *package*, reader package prefixes.
  janet_reality: Janet has modules/environments and symbols/keywords but no CL package
    system with equivalent reader semantics.
  required_plan_behavior: Implement Emacs-facing package metadata and completion namespaces;
    mark semantic equivalence as emulated-not-equivalent.
- id: conditions_restarts
  cl_feature: Condition system, restarts, debugger frames, invoke-nth-restart.
  janet_reality: Janet has errors/exceptions, fibers, and stack traces but not CL
    restarts.
  required_plan_behavior: Expose best-effort debugger commands and explicitly report
    unsupported restart classes.
- id: clos_mop
  cl_feature: CLOS classes, generic methods, MOP, remove-method-by-name, generic-method-specs.
  janet_reality: Janet tables/structs/prototypes do not provide CL MOP.
  required_plan_behavior: Provide Janet object inspection; mark CLOS-specific operations
    unsupported unless backed by a compatibility layer.
- id: compiler_notes
  cl_feature: compile-file, compiler warnings/notes with source locations.
  janet_reality: Janet compile/load pipeline has different diagnostics and source
    metadata.
  required_plan_behavior: Return SLY-shaped diagnostic envelopes with Janet-native
    fields and non-equivalence annotations.
- id: cl_lambda_lists
  cl_feature: '&optional, &key, &rest, &body, &allow-other-keys.'
  janet_reality: Janet function signatures and macros differ; CL syntax in specs is
    not executable Janet.
  required_plan_behavior: Normalize signatures in generated specs; tests must reject
    raw CL lambda-lists in Janet source.
- id: threads
  cl_feature: Implementation-dependent CL threads and debugger thread browser.
  janet_reality: Janet scheduling/fibers and host threads do not map one-to-one to
    CL implementation thread APIs.
  required_plan_behavior: Expose current Janet execution units and mark kill/debug
    behavior as limited where runtime does not support it.
testing_strategy:
  layers:
  - id: spec_inventory_tests
    purpose: Prove the project knows what SLY/SLYNK operations exist and how each
      maps to Janet.
    files:
      create:
      - tools/protocol_inventory.janet
      - test/protocol_inventory_tests.janet
      update:
      - docs/missing_protocol.md
      - docs/missing_protocol_definterface.md
    verification:
      focused: JANET_PATH=$PWD janet test/protocol_inventory_tests.janet
      aggregate: JANET_PATH=$PWD janet test/run_tests.janet
  - id: unit_contract_tests
    purpose: Verify individual registry, reader/writer, printer, completion, xref,
      inspector, and eval functions with real code, not mocks.
    files:
      update:
      - test/project_core_tests.janet
      - test/message-tests.janet
      - test/contrib_tests.janet
    verification:
      focused: make core-tests && make contrib-tests
      aggregate: make test
  - id: in_memory_server_tests
    purpose: Verify Emacs wire messages against an in-memory SLYNET server without
      flaky sleeps.
    files:
      update:
      - test/server_integration_tests.janet
      - test/channel_dispatch_tests.janet
      - test/client_test.janet
    rule: Use condition-based waiting for asynchronous server/channel effects; no
      arbitrary sleeps except documented timing behavior.
    verification:
      focused: JANET_PATH=$PWD janet test/server_integration_tests.janet
      aggregate: JANET_PATH=$PWD janet test/run_tests.janet
  - id: golden_protocol_tests
    purpose: Compare SLY-shaped request/response envelopes to fixtures derived from
      SLY source behavior.
    files:
      create:
      - test/fixtures/protocol/*.edn
      - test/golden_protocol_tests.janet
    verification:
      focused: JANET_PATH=$PWD janet test/golden_protocol_tests.janet
      aggregate: make test
  - id: emacs_ert_frontend_tests
    purpose: Verify frontend commands, process filters, major/minor mode behavior,
      and MREPL buffers under batch Emacs.
    files:
      create:
      - emacs/slynet.el
      - emacs/slynet-client.el
      - emacs/slynet-mrepl.el
      - test/emacs/slynet-frontend-tests.el
    verification:
      focused: emacs -Q --batch -L emacs -l test/emacs/slynet-frontend-tests.el -f
        ert-run-tests-batch-and-exit
      aggregate: make test-emacs
    environment_gate: If Emacs is unavailable, CI must report frontend tests skipped
      with reason, not passed.
  - id: smoke_end_to_end_tests
    purpose: Start a real Janet SLYNET server, connect the CLI or Emacs frontend,
      evaluate code, complete symbols, inspect a value, and close cleanly.
    files:
      create:
      - test/e2e/slynet_smoke.janet
      - scripts/run-e2e.sh
    verification:
      focused: scripts/run-e2e.sh
      aggregate: make all-tests
task_groups:
- id: T00_tasks_yml_governance
  title: Make tasks.yml the maintained implementation contract
  status: in_progress
  description: Keep this file synchronized with implementation, tests, and constraints.
    It is the source of truth until generated inventory files can supersede manual
    claims.
  files:
    create:
    - tasks.yml
    update:
    - TASKS.md
    - docs/tasks/current-task-plan.md
  operations:
  - description: Record baseline state, dirty working tree caveat, and green test
      result.
    consequence: Future implementation work can distinguish pre-existing code changes
      from plan changes.
  - description: Add a rule that every task carries focused and aggregate verification
      commands.
    consequence: Done status is evidence-based, not assertion-based.
  tests:
    red:
    - name: tasks.yml does not exist or lacks verification gates
      command: test ! -f tasks.yml || ! grep -q 'completion_gate' tasks.yml
      expected_failure: After creation this check must fail, proving the file now
        carries gates.
    green:
    - name: tasks.yml includes baseline, constraints, and task groups
      command: "python3 - <<'PY'\nfrom pathlib import Path\np=Path('tasks.yml').read_text()\n\
        for s in ['verified_baseline:', 'janet_design_constraints:', 'task_groups:',\
        \ 'testing_strategy:']:\n    assert s in p, s\nPY"
    aggregate:
    - JANET_PATH=$PWD janet test/run_tests.janet
  done_when:
  - tasks.yml exists and is reviewed whenever implementation status changes.
  - Current Janet tests still pass after creating/updating the plan.
- id: T01_protocol_inventory_generator
  title: Generate a machine-readable SLY/SLYNK-to-SLYNET inventory
  status: in_progress
  description: Build slynt's translation map from source, not from stale hand-written
    lists. Classify each reference operation as implemented, tested, stubbed, missing,
    emulated, or Janet-forbidden.
  files:
    create:
    - tools/protocol_inventory.janet
    - docs/generated/protocol-inventory.yml
    - test/protocol_inventory_tests.janet
    read:
    - sly_source/slynk/slynk.lisp
    - sly_source/slynk/slynk-backend.lisp
    - sly_source/slynk/slynk-rpc.lisp
    - sly_source/contrib/slynk-*.lisp
    - slynet/*.janet
    - slynet/contrib/*.janet
    - test/*.janet
    update:
    - docs/missing_protocol.md
    - docs/missing_protocol_definterface.md
    - tasks.yml
  operations:
  - description: Extract reference RPC/function names from SLY source and contrib
      source.
    consequence: Manual missing-protocol lists stop drifting from upstream SLY source.
  - description: Extract Janet definterface/defimplementation registrations and test
      mentions.
    consequence: Each operation receives implementation and test evidence.
  - description: Emit status records with source file, Janet file, test file, and
      constraint reason.
    consequence: A missing or unsupported operation is explicit and auditable.
  tests:
    red:
    - name: inventory detects stale missing_protocol entries
      command: JANET_PATH=$PWD janet test/protocol_inventory_tests.janet --case stale-missing-protocol
      expected_failure: Before implementation, ping/simple-completions are both implemented
        and listed as missing.
    green:
    - name: inventory classifies implemented handshake ops
      command: JANET_PATH=$PWD janet test/protocol_inventory_tests.janet --case handshake-status
    aggregate:
    - JANET_PATH=$PWD janet test/run_tests.janet
  implementation_slices:
  - id: T01-1_handshake_completion_inventory
    status: done
    description: Generate initial inventory records for ping, connection-info, simple-completions,
      and flex-completions.
    files:
      created:
      - tools/protocol_inventory.janet
      - docs/generated/protocol-inventory.yml
      - test/protocol_inventory_tests.janet
      updated:
      - test/run_tests.janet
      - tasks.yml
    verification_log:
    - date: '2026-05-14'
      phase: red
      command: bridge.yml:test
      result: 'failed as intended: tools/protocol_inventory.janet and docs/generated/protocol-inventory.yml
        missing'
    - date: '2026-05-14'
      phase: green
      command: JANET_PATH=$PWD janet test/run_tests.janet :report compact
      result: 'passed: 46 tests, 147/147 asserts, compact stdout_lines=4, stderr empty'
    - date: '2026-05-14'
      phase: regression
      command: bridge.yml:test
      result: 'passed: 46 tests, 147/147 asserts, stderr empty'
    limitations:
    - Current generator uses a curated first-slice operation list, not yet full source
      extraction.
    - Evidence matching is mention-based and can over-classify files that contain
      operation names in broad contexts.
  - id: T01-2_full_source_extraction
    status: done
    description: Expand generator to parse defslyfun, definterface, and contrib definitions
      across the full SLY source corpus.
    verification_log:
