iteration_policy:
  cadence:
  - 'Before each implementation task: write or update the focused failing test.'
  - 'After each passing implementation: update docs/generated/protocol-inventory.yml
    and this tasks.yml.'
  - 'After each task group: run aggregate tests and record the command/result in this
    file.'
  status_values:
  - todo
  - in_progress
  - blocked
  - done
  - emulated_not_equivalent
  - unsupported_by_janet_design
  blocked_rule: A blocked task must include the evidence command that revealed the
    block and either a Janet design constraint or an external dependency such as Emacs/CI
    environment availability.
