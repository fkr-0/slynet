  status: done
  priority: medium
  depends_on:
  - P5_compile_load_diagnostics
  - P24_project_server_lifecycle
  goal: Add SLYNK-shaped compile/macroexpand wrappers and Janet project/session metadata records while keeping CL compiler-note and image equivalence false.
  contracts:
  - slynk-compile-string and slynk-compile-file wrap Janet diagnostic envelopes with explicit emulated support metadata.
  - slynk macroexpand/compiler-macroexpand/expand wrappers expose expansion strings but do not claim CL compiler-macroexpand equivalence.
  - slynet-project-snapshot and slynet-session-metadata preserve Janet project/session state without CL image equivalence.
  tests:
    green:
    - JANET_PATH=$PWD janet test/run_tests.janet :match phase27 :report compact
  verification:
    green: JANET_PATH=$PWD janet test/run_tests.janet :report compact passed 122 tests / 842 assertions; Emacs ERT passed 35 tests.

- id: P28_namespace_browser_package_boundary
  title: Janet namespace browser and CL package-local nickname boundary
  status: done
  priority: medium
  depends_on:
  - P23_completion_docs_namespace
  goal: Provide a Janet module/environment namespace browser and explicit unsupported records for CL package-local nickname behavior.
  contracts:
  - namespace-browser returns Janet namespace/module records with cl-package-equivalent=false.
  - package-local-nicknames and find-locally-nicknamed-package return unsupported records with CL package-local nickname equivalence false.
  - The feature is a Janet namespace facade, not CL package mutation/import/export parity.
  tests:
    green:
    - JANET_PATH=$PWD janet test/run_tests.janet :match phase28 :report compact
  verification:
    green: JANET_PATH=$PWD janet test/run_tests.janet :report compact passed 122 tests / 842 assertions; Emacs ERT passed 35 tests.

- id: P25_trace_timing_runtime_utility
  title: Janet-native trace/timing and backend runtime utility records
  status: done
  priority: medium
  depends_on:
  - P16_runtime_instrumentation
  - P18_source_index_v2
  goal: Add source-linked trace/timing records and explicit backend runtime utility capability metadata.
  why: Useful Janet developer utility should expose timing/trace records and honest unsupported boundaries for CL runtime utilities.
  contracts:
  - slynet-trace-eval records result, elapsed time, source location, source-index kind, and non-CL trace metadata.
  - backend-runtime-capabilities lists callable native utilities and unsupported CL/runtime gaps with rationale.
  - backend-runtime-operation returns structured unsupported metadata for abandoned runtime features such as save-image.
  tests:
    red:
    - P25 tests failed first on missing trace/backend-runtime RPC behavior.
    green:
    - bridge.yml:test passed 122 tests / 842 assertions.

- id: P26_profile_protocol_browser
  title: Wrapper profiling and protocol/interface browser
  status: done
  priority: medium
  depends_on:
  - P17_protocol_interface_registry_alignment
  - P25_trace_timing_runtime_utility
  goal: Provide SLYNET wrapper-profile records plus a Janet-native protocol/interface browser.
