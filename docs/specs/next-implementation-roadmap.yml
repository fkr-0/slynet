- id: P29_doc_browser_autodoc_completion
  title: Scrollable Janet docs, autodoc, and complete-form metadata
  status: done
  priority: medium
  depends_on:
  - P23_completion_docs_namespace
  - P28_namespace_browser_package_boundary
  goal: Provide a practical Janet docs/autodoc/complete-form loop for Emacs using Janet docs and source-index facts.
  contracts:
  - autodoc returns operator, arglist, doc text, support class, source locations, and CL autodoc equivalence false.
  - complete-form returns prefix, candidates, doc summaries, source-index metadata, and CL complete-form equivalence false.
  - Emacs renders doc/autodoc payloads in a normal scrollable slynet-doc buffer.
  - Suite architecture and warning policy remain explicit.
  tests:
    green:
    - janet test/run_tests.janet
    - make test-emacs
  verification:
    green: Janet aggregate passed 128 tests / 878 assertions before doc update; Emacs ERT passed 38 tests.
