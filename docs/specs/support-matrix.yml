janet_extension_candidates:
  stable_eval_source_maps:
    current_support_class: workaround
    owning_spec: docs/specs/janet-extension-candidates.md
    workaround: source-index fallback and snippets
    extension_value: stable source maps for evaled forms, diagnostics, debugger frames,
      and xref
    release_rule: do not mark dynamic or eval locations native unless native source-map
      data exists
    implemented_api:
    - source-aware-eval
    - lookup-eval-source-map
  rich_debug_frame_locals:
    current_support_class: workaround
    owning_spec: docs/specs/janet-extension-candidates.md
    workaround: debug-stack slots, limited locals, printed values
    extension_value: stable named lexical locals and slot provenance for debugger
      frames
    release_rule: do not invent local names; mark placeholders synthetic or SLYNET-produced
    implemented_api:
    - debugger-info-for-emacs
    - debugger-frame-details
    - frame-locals-and-catch-tags
  resumable_debugger_control_api:
    current_support_class: pending_design
    owning_spec: docs/specs/janet-extension-candidates.md
    workaround: wrap current Janet debugger controls where available; otherwise mark
      unsupported
    extension_value: resumable debug session API for step, next, out, continue, and
      control identity
    release_rule: expose controls only with support metadata and real Janet debug-fiber
      backing
    implemented_api:
    - debugger-control-capabilities
    - debugger-control-action
  structured_signal_metadata:
    current_support_class: emulated
    owning_spec: docs/specs/janet-extension-candidates.md
    workaround: SLYNET condition records and diagnostic envelopes
    extension_value: structured signal phase, cause, fiber, stack, and source-map
      metadata
    release_rule: keep CL condition and restart equivalence false for synthetic facades
  function_arg_metadata:
    current_support_class: workaround
    owning_spec: docs/specs/janet-extension-candidates.md
    workaround: arglist cache, overrides, metadata registry
    extension_value: uniform metadata for user functions, macros, native functions,
      and callable types
    release_rule: display provenance for inferred, cached, or overridden signatures
    implemented_api:
    - register-function-metadata
    - function-metadata
    - list-function-metadata
  instrumentation_hooks:
    current_support_class: workaround
    owning_spec: docs/specs/janet-extension-candidates.md
    workaround: SLYNET wrapper and recording layer
    extension_value: low-overhead function, call-site, timing, profiling, debugger-event,
      and sticker hooks
    release_rule: state whether records came from wrapper, source transform, debugger
      control, or native hook
    implemented_api:
    - record-instrumentation-event
    - list-instrumentation-events
    - clear-instrumentation-events
