version: 1
project: slynet
purpose: Machine-readable support matrix for SLY/SLYNK frontend-behavior equivalence
  on Janet. This file is checked by P10 protocol inventory tests and is the bridge
  between phase planning, split specifications, and generated operation ownership.
support_classes:
  native: Janet exposes the behavior directly with small protocol adaptation.
  emulated: SLYNET provides metadata, source indexes, wrappers, registries, or side
    channels to approximate the frontend behavior.
  unsupported: Janet currently exposes no safe substrate and no SLYNET shim exists
    for the operation.
  internal: Implementation detail not intended as a user-facing frontend contract.
  pending_design: Accepted target whose final staged contract is not yet written.
state_details:
  implemented_native_tested: Native behavior is implemented and has executable coverage.
  implemented_native_untested: Native behavior exists but needs direct contract tests.
  implemented_emulated_tested: Emulated behavior is implemented and has executable
    coverage.
  implemented_emulated_untested: Emulated behavior exists but needs direct contract
    tests.
  missing_constrained: Missing because of a known CL-vs-Janet mismatch.
  missing_unconstrained: Missing without a known semantic constraint.
frontend_surfaces:
  transport:
    owning_spec: docs/specs/emacs-client-contract.md
    validation_stage: P1_transport_session_protocol
  repl:
    owning_spec: docs/specs/emacs-client-contract.md
    validation_stage: P6_emacs_repl_buffer_ui
  completion:
    owning_spec: docs/specs/emacs-client-contract.md
    validation_stage: P7_completion_autodoc_capf
  inspector:
