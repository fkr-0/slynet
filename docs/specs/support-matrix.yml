  backend:
    owning_spec: docs/specs/emacs-client-contract.md
    validation_stage: P0_inventory_truth
constraints:
  cl_packages:
    support_class: emulated
    owning_spec: docs/specs/emacs-client-contract.md
    rationale: Janet has modules and environments, not CL package and reader package
      semantics.
  conditions_restarts:
    support_class: emulated
    owning_spec: docs/specs/debugger-condition-restarts.md
    rationale: Janet exceptions and stack traces do not expose CL condition and restart
      semantics.
  clos_mop:
    support_class: unsupported
    owning_spec: docs/specs/debugger-condition-restarts.md
    rationale: Janet does not expose CLOS/MOP generic function and method metadata.
  compiler_notes:
    support_class: emulated
    owning_spec: docs/specs/emacs-client-contract.md
    rationale: Janet diagnostics differ from CL compiler-note objects and source-note
      semantics.
  threads:
    support_class: emulated
    owning_spec: docs/specs/threading-execution-units.md
    rationale: Janet fibers, tasks, and server connections do not map one-to-one to
      CL thread APIs.
