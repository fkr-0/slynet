    validation_stage: P8_inspector_xref_emacs_ui
  xref:
    owning_spec: docs/specs/inspector-xref-source-index.md
    validation_stage: P8_inspector_xref_emacs_ui
  debugger:
    owning_spec: docs/specs/debugger-condition-restarts.md
    validation_stage: P9_debugger_execution_unit_emacs_ui
  compile_load:
    owning_spec: docs/specs/emacs-client-contract.md
    validation_stage: P13_diagnostics_ui
  namespace:
    owning_spec: docs/specs/emacs-client-contract.md
