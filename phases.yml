    verification_log:
      - date: "2026-06-13"
        red: "New debugger ERT tests failed first on missing slynet-debugger-info, slynet-debugger-invoke-restart, and slynet-list-execution-units APIs."
        green: "timeout 45s eldev test --file test/emacs/slynet-inspector-xref-tests.el test/emacs/slynet-d*.el passed 6 focused P8/P9 tests."


  - id: P10_spec_consolidation_support_matrix
    title: "Spec consolidation and support matrix"
    status: done
    depends_on:
      - P0_inventory_truth
      - P9_debugger_execution_unit_emacs_ui
    goal: >-
      Convert the working-draft equivalence material into a staged contract suite
