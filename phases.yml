  - id: P8_inspector_xref_emacs_ui
    title: "Inspector and xref Emacs buffers"
    status: done
    depends_on:
      - P4_inspector_xref_source_index
      - P7_completion_autodoc_capf
    goal: >-
      Expose the P4 inspector and source-index contracts through first-class
