    contracts:
      - slynet-inspect-value requests inspect-for-emacs and renders a stable-object inspector buffer.
      - slynet-inspector-nth-part requests inspector-nth-part and records parent/object/part metadata.
      - slynet-inspector-pop remains available for parent navigation.
      - slynet-find-definitions requests find-definitions-for-emacs and renders source-index hits with navigation text properties.
    tests:
      red:
        - "eldev test --file test/emacs/slynet-inspector-xref-tests.el"
      green:
        - "eldev test --expect 19"
    done_when:
      - "Inspector buffer displays title/content and stores object-id metadata."
      - "Inspector nth-part displays child title/content plus parent-object-id and part-key metadata."
      - "Xref buffer displays file/line/column/snippet and annotates hits with source-index text properties."
    verification_log:
      - date: "2026-06-13"
        red: "New inspector/xref ERT tests failed first on missing slynet-inspect-value, slynet-inspector-nth-part, and slynet-find-definitions APIs."
        green: "timeout 45s eldev test --file test/emacs/slynet-inspector-xref-tests.el test/emacs/slynet-d*.el passed 6 focused P8/P9 tests."

  - id: P9_debugger_execution_unit_emacs_ui
    title: "Debugger and execution-unit Emacs buffers"
