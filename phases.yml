version: 1
project: slynet
purpose: >-
  Staged route from the current SLYNET prototype to frontend-behavior equivalence
  with SLY/SLYNK where Janet can support it through native behavior, runtime
  tooling, source indexing, or explicit emulation layers.

status_model:
  support_class_values:
    - native
    - emulated
    - unsupported
    - internal
    - pending_design
  state_detail_values:
    - implemented_native_tested
    - implemented_native_untested
    - implemented_emulated_tested
    - implemented_emulated_untested
    - missing_constrained
    - missing_unconstrained
  validation_rule: >-
    A phase is done only when its listed verification commands pass freshly and
    its inventory/support changes are reflected in docs/generated/protocol-inventory.yml.

phases:
  - id: P0_inventory_truth
    title: "Precise protocol support inventory"
    status: done
    goal: >-
      Make the generated inventory precise enough to measure support instead of
      only saying implemented or missing.
    contracts:
      - Every operation has frontend_surface.
      - Every operation has support_class.
      - Every operation has state_detail.
      - Constraint-bearing operations are classified as emulated or constrained, not plain native.
      - All used constraints are documented in tasks.yml and the equivalence contracts spec.
    files:
      update:
        - tools/protocol_inventory.janet
        - test/protocol_inventory_tests.janet
        - docs/generated/protocol-inventory.yml
        - tasks.yml
      create:
        - docs/specs/cl-janet-equivalence-contracts.md
        - phases.yml
    tests:
      red:
        - "JANET_PATH=$PWD janet test/protocol_inventory_tests.janet :match 'precise support fields'"
        - "JANET_PATH=$PWD janet test/protocol_inventory_tests.janet :match 'frontend surface mapping'"
      green:
        - "JANET_PATH=$PWD janet test/protocol_inventory_tests.janet :report compact"
      aggregate:
        - "JANET_PATH=$PWD janet test/run_tests.janet :report compact"
    done_when:
      - "Inventory schema_version is at least 3."
      - "Representative operations ping, create-mrepl, simple-completions, backtrace, inspect-nth-part, and find-definitions-for-emacs carry frontend_surface/support_class/state_detail."
    verification_log:
      - date: "2026-06-12"
        command: "JANET_PATH=$PWD janet tmp-protocol-red-runner.janet"
        result: "passed: 8 tests, 48/48 asserts after RED failure confirmed missing precise support fields."

  - id: P1_transport_session_protocol
    title: "Deterministic transport and session protocol"
    status: done
    goal: >-
      Establish deterministic wire framing and session-message behavior before
      deeper Emacs E2E work depends on it.
    contracts:
      - Six-byte hexadecimal length prefixes count UTF-8 bytes.
      - Fragmented frames remain incomplete until enough bytes arrive.
      - Multiple frames in one buffer can be consumed without data loss.
      - Malformed frame prefixes yield explicit protocol errors.
      - Message helpers are available to both backend tests and client/E2E tests.
    files:
      update:
        - slynet/rpc.janet
        - test/message-tests.janet
        - test/run_tests.janet
        - bridge.yml
    tests:
      red:
        - "JANET_PATH=$PWD janet test/message-tests.janet :match 'transport frame'"
      green:
        - "JANET_PATH=$PWD janet test/message-tests.janet :report compact"
      aggregate:
        - "JANET_PATH=$PWD janet test/run_tests.janet :report compact"
        - "eldev test --expect 6"
    done_when:
      - "Backend transport helper tests pass for encode, incomplete, multi-frame, and malformed-frame cases."
      - "Existing client codec tests still pass under Eldev."
    verification_log:
      - date: "2026-06-12"
        command: "JANET_PATH=$PWD janet test/run_tests.janet :match 'transport frame' :report compact"
        result: "passed within 65-test suite: 216/216 assertions."

  - id: P2_eval_mrepl_first_real_e2e
    title: "First real Emacs ↔ Janet MREPL E2E"
    status: done
    depends_on:
      - P1_transport_session_protocol
    goal: >-
      Make Eldev/ERT start a real Janet SLYNET server, connect the Emacs client,
      create an MREPL, evaluate code, receive values, and close cleanly.
    contracts:
      - create-mrepl returns remote channel and thread/execution-unit id.
      - eval sends channel process messages.
      - :write-values resolves a pending request/callback.
      - prompt updates and listener output are tracked in client connection state.
      - Full user-facing REPL buffer rendering remains a later client/UI slice.
    files:
      update:
        - emacs/slynet-client.el
        - emacs/slynet.el
        - slynet/backend.janet
        - slynet/cli.janet
        - slynet/contrib/slynet-mrepl.janet
        - slynet/rpc.janet
        - slynet/slynk.janet
        - test/emacs/slynet-e2e-tests.el
        - test/project_core_tests.janet
        - test/server_integration_tests.janet
        - Makefile
        - bridge.yml
    tests:
      red:
        - "eldev test --file test/emacs/slynet-e2e-tests.el"
      green:
        - "eldev test --file test/emacs/slynet-e2e-tests.el"
        - "eldev test --expect 7"
      aggregate:
        - "JANET_PATH=$PWD janet test/run_tests.janet :report compact"
        - "make test-emacs"
    done_when:
      - "Eldev/ERT starts a live Janet TCP SLYNET server without fixed sleeps."
      - "Emacs creates an MREPL through the live wire protocol."
      - "Emacs channel eval of (+ 1 2) resolves with a value containing 3."
      - "Client state records prompt text and MREPL listener output."
    verification_log:
      - date: "2026-06-12"
        red: >-
          eldev test --file test/emacs/slynet-e2e-tests.el failed first at missing
          slynet-create-mrepl, then at backend startup/registry/wire/parser/eval
          defects before value delivery.
        green: >-
          eldev test --file test/emacs/slynet-e2e-tests.el passed: live Janet TCP
          server, Emacs connect, create-mrepl, eval, value callback, prompt/output
          state, and clean disconnect.

  - id: P3_thread_debugger_condition_facade
    title: "Thread/execution-unit and debugger condition facade"
    status: done
    depends_on:
      - P0_inventory_truth
      - P1_transport_session_protocol
    goal: >-
      Begin replacing CL thread and condition assumptions with SLYNET-managed
      execution units and condition/restart facade objects.
    contracts:
      - list-threads returns SLYNET execution units.
      - eval errors create condition records.
      - debugger-info-for-emacs exposes condition text, frames, and synthetic restarts.
      - invoke-nth-restart works for abort-to-repl synthetic restart.
      - Debugger facade behavior follows docs/specs/debugger-condition-facade-contract.md.
    files:
      update:
        - slynet/slynk.janet
        - test/run_tests.janet
      create:
        - docs/specs/debugger-condition-facade-contract.md
        - test/debugger_facade_tests.janet
    tests:
      red:
        - "JANET_PATH=$PWD janet test/run_tests.janet :match 'execution units expose Janet thread facade metadata' :report compact"
        - "JANET_PATH=$PWD janet test/run_tests.janet :match 'eval errors create condition records with synthetic abort restart' :report compact"
      green:
        - "JANET_PATH=$PWD janet test/run_tests.janet :report compact"
    done_when:
      - "list-threads returns SLYNET execution-unit metadata, including thread-model and CL equivalence flag."
      - "eval errors create structured condition-record payloads."
      - "debugger restarts expose synthetic abort-to-repl metadata and invoke-nth-restart returns that restart name."
    verification_log:
      - date: "2026-06-12"
        red: "New phase3 tests failed on missing execution-unit metadata and structured condition/restart records."
        green: "JANET_PATH=$PWD janet test/run_tests.janet :report compact passed 73 tests / 256 assertions after implementation."
      - date: "2026-06-12"
        docs: "docs/specs/debugger-condition-facade-contract.md added and structurally checked: status, execution-unit, condition-record, restart-facade, and done-criteria sections present."
        green: "JANET_PATH=$PWD janet test/run_tests.janet :report compact passed 79 tests / 304 assertions after P3 spec and P4/P5 contract additions."
      - date: "2026-06-12"
        contract_refinement: "P3 frame facade locations now explicitly expose synthetic-location=true and source-kind=:synthetic-facade."
        green: "JANET_PATH=$PWD janet test/run_tests.janet :report compact passed 80 tests / 309 assertions."
      - date: "2026-06-12"
        debugger_source_index_first_pass: "Known debugger facade frames now carry callable metadata and resolve source locations through the P4 source index; unresolved frames retain synthetic-facade metadata."
        focused: "JANET_PATH=$PWD janet test/run_tests.janet :match 'debugger frame locations use source index when callable is known' :report compact passed inside 81-test suite with 321/321 assertions."

      - date: "2026-06-12"
        native_janet_debug_stack_frames: "Debugger state now captures the caught Janet error fiber, normalizes available debug/stack frames as source-kind=:janet-debug-stack, and keeps source-index plus synthetic-facade fallbacks."
        focused: "JANET_PATH=$PWD janet test/run_tests.janet :match 'debugger frames prefer native Janet debug stack facts' :report compact passed inside 82-test suite with 334/334 assertions."
        green: "JANET_PATH=$PWD janet test/run_tests.janet :report compact passed 82 tests / 334 assertions."
      - date: "2026-06-13"
        frontend_event_green: "eldev test --expect 28 passed 28/28 ERT tests; backend focused event test passed 15/15 assertions."

  - id: P4_inspector_xref_source_index
    title: "Inspector and xref source-index foundation"
    status: done
    depends_on:
      - P0_inventory_truth
      - P1_transport_session_protocol
    goal: >-
      Provide stable inspection object navigation and source-index-backed xref
      locations for the first fixture project.
    contracts:
      - Inspector values have stable ids and navigable parts.
      - find-definitions-for-emacs returns exact fixture file/line/column/snippet.
      - Unsupported xref classes return explicit support metadata.
      - Xref/source-index behavior follows docs/specs/xref-source-index-contract.md.
    files:
      create:
        - docs/specs/xref-source-index-contract.md
        - test/fixtures/xref/sample_a.janet
        - test/fixtures/xref/sample_b.janet
        - test/fixtures/xref/generated_ignore.janet
        - test/inspector_xref_contract_tests.janet
      update:
        - slynet/slynk.janet
        - test/run_tests.janet
        - docs/generated/protocol-inventory.yml
    tests:
      red:
        - "JANET_PATH=$PWD janet test/run_tests.janet :match 'inspector responses expose stable object identity metadata' :report compact"
        - "JANET_PATH=$PWD janet test/run_tests.janet :match 'xref responses expose source-index contract metadata' :report compact"
      green:
        - "JANET_PATH=$PWD janet test/run_tests.janet :report compact"
    done_when:
      - "Inspector responses carry stable object-id, parent-object-id, and part-key metadata."
      - "inspector-pop returns the original parent object-id after nth-part navigation."
      - "find-definitions-for-emacs emits source-index and xref-kind metadata with file/line/column/snippet."
    verification_log:
      - date: "2026-06-12"
        red: "New phase4 tests initially failed on fixture-backed xref exact line/column matching and token-boundary handling."
        green: "JANET_PATH=$PWD janet test/run_tests.janet :report compact passed 79 tests / 304 assertions after fixture and scanner contract implementation."


  - id: P5_compile_load_diagnostics
    title: "Compile/load diagnostics and source-note envelopes"
    status: done
    depends_on:
      - P0_inventory_truth
      - P4_inspector_xref_source_index
    goal: >-
      Give compile-string, compile-file, and load-file a structured Janet
      diagnostic envelope that the Emacs client can render like SLY compiler
      notes without claiming CL compiler-note semantic equivalence.
    contracts:
      - compile-string-for-emacs preserves legacy :notes and adds :diagnostics.
      - diagnostic entries carry severity, phase, message, diagnostic-model, and CL-equivalence flag.
      - load-file diagnostics include the attempted path.
      - successful compile/load calls expose empty diagnostics and explicit Janet diagnostic model metadata.
    files:
      update:
        - slynet/slynk.janet
        - test/run_tests.janet
        - test/project_core_tests.janet
        - phases.yml
        - docs/specs/cl-janet-equivalence-contracts.md
      create:
        - test/compile_load_contract_tests.janet
    tests:
      red:
        - "JANET_PATH=$PWD janet test/run_tests.janet :match 'diagnostic' :report compact"
      green:
        - "JANET_PATH=$PWD janet test/run_tests.janet :match 'diagnostic' :report compact"
      aggregate:
        - "JANET_PATH=$PWD janet test/run_tests.janet :report compact"
        - "eldev test --expect 7"
    done_when:
      - "compile-string success returns :diagnostics @[], :diagnostic-model :janet-diagnostics, and CL-equivalence false."
      - "compile-string failure returns one structured :compile-string diagnostic."
      - "load-file failure returns one structured :load-file diagnostic including :path."
    verification_log:
      - date: "2026-06-12"
        red: "New P5 diagnostic tests failed on missing :diagnostics/:diagnostic-model fields."
        green: "JANET_PATH=$PWD janet test/run_tests.janet :match 'diagnostic' :report compact passed 79 tests / 304 assertions."

  - id: P6_emacs_repl_buffer_ui
    title: "User-facing Emacs REPL buffer"
    status: done
    depends_on:
      - P2_eval_mrepl_first_real_e2e
      - P5_compile_load_diagnostics
    goal: >-
      Move the Emacs client from transport/state callbacks into a usable REPL
      buffer with prompt rendering, input history, output insertion, eval-region,
      and diagnostic display.
    contracts:
      - slynet-repl opens or reuses a per-connection REPL buffer.
      - MREPL prompt updates are rendered as read-only prompt text.
      - write-string and write-values are inserted in order.
      - input history survives multiple evals within a session.
      - compile/load diagnostics render as clickable source-note candidates once source mapping is available.
    tests:
      red:
        - "eldev test --file test/emacs/slynet-repl-tests.el"
      green:
        - "eldev test --expect 13"
    done_when:
      - "slynet-repl opens and reuses a per-connection REPL buffer."
      - "Channel write-string/write-values/prompt payloads render into the buffer in order."
      - "Rendered prompt text is read-only."
      - "slynet-repl-submit-string records buffer-local input history and dispatches MREPL eval."
    verification_log:
      - date: "2026-06-13"
        red: "eldev test --file test/emacs/slynet-repl-tests.el failed first on missing slynet-repl and REPL buffer API."
        green: "eldev test --file test/emacs/slynet-repl-tests.el passed 3 REPL buffer tests; full Eldev gate updated to 13 tests."

  - id: P7_completion_autodoc_capf
    title: "Completion-at-point and autodoc surface"
    status: done
    depends_on:
