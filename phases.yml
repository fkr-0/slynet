  - id: P14_project_connection_management
    title: "Project and named connection management"
    status: done
    depends_on:
      - P2_eval_mrepl_first_real_e2e
      - P6_emacs_repl_buffer_ui
    goal: >-
      Provide the first daily-use connection management layer: named
      connections, project-root discovery, reconnect, and server-process seams.
    contracts:
      - slynet-connect-named stores connections by label and makes them current.
      - slynet-switch-connection switches the active connection by label.
      - slynet-project-root detects Janet project roots from project.janet, jpm_tree, or .git.
      - slynet-start-server and slynet-reconnect expose process/reconnect seams for later hardening.
    tests:
      red:
