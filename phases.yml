      - P16_runtime_instrumentation
    goal: >-
      Close the implementation-without-interface gap for staged extension RPCs so
      the public protocol registry, inventory, docs, and runtime warning surface
      agree about implemented extension operations.
    contracts:
      - Every implemented extension RPC introduced by P11-P16 has a matching definterface declaration unless explicitly private/internal.
      - Runtime instrumentation, debugger helper, inspector rendering, macroexpand helper, thread metadata, and apropos extension RPCs are declared.
      - Historical declared-but-unimplemented SLY/SLYNK gaps remain inventory signal rather than being hidden.
    files:
      update:
        - slynet/interfaces.janet
        - test/project_core_tests.janet
        - phases.yml
        - docs/specs/support-matrix.yml
        - docs/specs/README.md
        - docs/specs/cl-janet-equivalence-contracts.md
      create:
        - docs/specs/protocol-interface-registry.md
    tests:
      red:
        - "JANET_PATH=$PWD janet test/run_tests.janet :match 'implemented extension RPCs have interface declarations' :report compact failed on missing extension RPC interface declarations."
      green:
        - "JANET_PATH=$PWD janet test/run_tests.janet :match 'implemented extension RPCs have interface declarations' :report compact passed 92 tests / 560 assertions."
    done_when:
      - "Representative implemented extension RPCs have both inf/get-implementation and inf/get-interface."
      - "slynet-apropos has a contrib interface declaration matching its registered implementation."

